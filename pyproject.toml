[project]
name = "store-assistant"
version = "0.1.0"
description = "Conversational agent that saves and retrieves store phone numbers"
readme = "README.md"
authors = [
    { name = "Mario", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langsmith>=0.14.8",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = ["**/tests/", "**/conftest.py"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = ["--import-mode=importlib"]
markers = ["llm: calls the real OpenAI API"]
filterwarnings = ["error"]

[tool.mypy]
strict = true
files = ["src"]
