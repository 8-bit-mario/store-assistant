# Checks run before every commit. Install once with: uv run pre-commit install
# Each hook runs through uv, so it uses the tool versions pinned in uv.lock. Nothing is rewritten.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-offline
        name: pytest (offline, no LLM calls)
        entry: uv run pytest -m "not llm" -q
        language: system
        types_or: [python, toml]
        pass_filenames: false
